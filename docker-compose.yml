services:
  nest-app:
    build:
      context: .

    image: nest-app

    env_file: .env

    environment:
      DB_HOST: db

    ports:
      - "3000:3000"

    volumes:
      - ./secrets/db_password:/app/secrets/db_password:ro

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: marketplace

    secrets:
      - db_password

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d marketplace"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password
